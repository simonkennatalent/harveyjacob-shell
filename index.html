<style>
:root{--navy:#0f1b3d;--navy2:#16255a;--ink:#0f1b3d;--line:#e5e7eb;--muted:#64748b;--gold:#e3a72f}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:#f6f8fb}
.hide{display:none!important}
#login{display:flex;height:100vh}

.hero{position:relative;z-index:1;text-align:center;color:#fff;max-width:520px;padding:32px}
.hero h1{font-size:40px;line-height:1.15;font-weight:800;margin:0}
.hero p{font-size:18px;line-height:1.55;font-weight:400;margin:18px 0 0;color:rgba(255,255,255,.92)}
.copyr{position:absolute;bottom:22px;left:0;right:0;z-index:1;text-align:center;color:rgba(255,255,255,.75);font-size:12px}
#login .right{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.card{width:100%;max-width:360px;text-align:center}
.card img.logo{height:52px;margin-bottom:14px}
.card .signin-sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.field{text-align:left;margin-top:16px}
label{display:block;font-size:12px;font-weight:600;color:#334155;margin:0 0 6px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none}input:focus{border-color:var(--navy)}
button.primary{width:100%;margin-top:26px;padding:13px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button.primary:hover{background:var(--navy2)}
.err{color:#b91c1c;font-size:13px;margin-top:12px;min-height:16px}
.secured{margin-top:26px;color:#94a3b8;font-size:12px}
header.top{display:flex;align-items:center;gap:24px;background:var(--navy);color:#fff;padding:0 22px;height:60px}
header.top img.logo{height:30px;filter:brightness(0) invert(1)}
nav{display:flex;gap:4px}nav a{color:#c7d0e6;text-decoration:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
nav a.active{background:rgba(255,255,255,.12);color:#fff}nav a:hover{color:#fff}
.spacer{flex:1}.who{font-size:13px;color:#c7d0e6}
.signout{margin-left:14px;font-size:13px;color:#fff;background:rgba(255,255,255,.1);border:0;padding:7px 12px;border-radius:8px;cursor:pointer}
main{max-width:1080px;margin:26px auto;padding:0 22px}h2.section{font-size:20px;margin:0 0 4px}
.empty{margin-top:40px;border:1px dashed #cbd5e1;border-radius:14px;padding:56px 24px;text-align:center;color:var(--muted);background:#fff}.empty b{display:block;color:#334155;font-size:16px;margin-bottom:6px}
